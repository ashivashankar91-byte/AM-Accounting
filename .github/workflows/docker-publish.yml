name: Build and Publish Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:  # manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/ashivashankar91-byte

# Required for GHCR push to work with GITHUB_TOKEN
# Also set in repo: Settings → Actions → General → "Read and write permissions"
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false   # Don't cancel other services if one fails
      matrix:
        service:
          - agent-apar
          - agent-eom
          - agent-gl
          - agent-payroll
          - agent-t1
          - analytics-service
          - apar-service
          - api-gateway
          - approval-service
          - audit-service
          - auth-service
          - cashflow-service
          - coa-service
          - compliance-service
          - connector-service
          - document-service
          - eom-service
          - fs-service
          - gl-service
          - group-service
          - notification-service
          - onboarding-service
          - orchestrator-service
          - payroll-service
          - query-service
          - recon-service
          - schedule-service
          - tenant-service
          - user-service
          - webhook-service
          - web

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE="services/${{ matrix.service }}/Dockerfile"
          [ -f "$FILE" ] || FILE="apps/${{ matrix.service }}/Dockerfile"
          if [ ! -f "$FILE" ]; then
            echo "No Dockerfile found for ${{ matrix.service }}, skipping"
            exit 0
          fi
          IMAGE="${{ env.IMAGE_PREFIX }}/${{ matrix.service }}"
          docker build -t "${IMAGE}:latest" -t "${IMAGE}:${{ github.sha }}" -f "$FILE" .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"
