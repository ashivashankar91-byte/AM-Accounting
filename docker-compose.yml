x-service-env: &service-env
  # FINAL-R0 Priority 1 (R0_TRUST_BASELINE_RECERTIFICATION): parameterized
  # via .env, defaulting to the amacc_app role (see
  # infra/postgres/init/01-create-app-role.sql) so RLS is actually
  # enforced at runtime -- never the amacc superuser, which
  # unconditionally bypasses RLS regardless of policy/FORCE settings.
  DATABASE_URL: ${DATABASE_URL:-postgresql://amacc_app:amacc_app_dev@postgres:5432/amacc}
  RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
  REDIS_URL: redis://redis:6379
  NODE_ENV: development
  # FINAL-R0 Priority 0: authentication bypass is a separate, explicit opt-in
  # flag — NOT inferred from NODE_ENV. Standard/default compose runs (this
  # file) must always fail-closed on JWT validation. Never set this to
  # 'true' here; it exists only so an explicit test-only override file can
  # turn it on deliberately.
  AUTH_BYPASS_ENABLED: ${AUTH_BYPASS_ENABLED:-false}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-sk-ant-placeholder}
  # AMACC_JWT_SECRET must be set in .env â€” no default allowed in production
  AMACC_JWT_SECRET: ${AMACC_JWT_SECRET:?AMACC_JWT_SECRET is required}
  # Golden R0 Phase 5 fix: JWT_SECRET is no longer used by any signature
  # issuance or verification path (auth-service and every downstream
  # consumer, including the internal audit outbox drainer, now use
  # AMACC_JWT_SECRET exclusively) -- kept required here only because some
  # deployments may still reference it; do not wire new code to it.
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_ISSUER: amacc
  ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
  AMACC_INTERNAL_TOKEN: ${AMACC_INTERNAL_TOKEN:-amacc-internal-dev}

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 5

services:
  # --- Infrastructure ---
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: amacc
      POSTGRES_PASSWORD: amacc_dev
      POSTGRES_DB: amacc
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # FINAL-R0 Priority 1: auto-creates the least-privilege amacc_app role
      # on first boot of a fresh volume (Postgres only runs initdb.d scripts
      # when the data directory is empty). For an existing volume, run this
      # SQL manually once against the amacc superuser.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amacc"]
      <<: *healthcheck

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      <<: *healthcheck

  # Migration-orchestration fix (STABILIZE THE CONSOLIDATED ACCOUNTING
  # APPLICATION): one-shot job that runs `prisma migrate deploy` for every
  # service against the shared `amacc` database as the privileged `amacc`
  # superuser (see scripts/migrate-all.sh). Every service below that owns
  # Prisma migrations depends on this completing successfully first, so a
  # brand-new developer can go from an empty `pgdata` volume to a running
  # application with a single `docker compose up --build` — no manual
  # migration step required.
  migrator:
    build:
      context: .
      dockerfile: infra/migrator/Dockerfile
    environment:
      MIGRATE_DATABASE_URL: postgresql://amacc:amacc_dev@postgres:5432/amacc
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

