# LOCAL ONLY. Remaps every host port so this final-r0 worktree's stack can
# run alongside another already-running am-accounting docker-compose stack
# on the same host without port conflicts.
#
# Golden R0 UI convergence — Phase 5 fix: `ports` is a list-type compose
# attribute, and this Compose version (v5.1.3) MERGES/appends list values
# across `-f` files by default rather than replacing them -- every service
# was being published on BOTH its base docker-compose.yml port AND this
# override's port simultaneously. Since almost every base port collides
# with the unrelated sibling `am-accounting` stack already running on this
# host, every service failed to start ("port is already allocated") even
# though the override port itself was free. Fixed by tagging every `ports`
# key `!override` (Compose spec merge-control tag), which forces full
# replacement instead of appending. postgres/redis/rabbitmq are also
# re-pointed at 45433/46380/45673+55673 -- the ports the long-lived,
# already-seeded final-r0 infra containers were actually running on before
# this fix (see KNOWN_LIMITATIONS_REGISTER.md row 9), not the stale
# +10000 values previously in this file.
services:
  agent-apar:
    ports: !override
    - 13023:3023
  agent-eom:
    ports: !override
    - 13021:3021
  agent-gl:
    ports: !override
    - 13020:3020
