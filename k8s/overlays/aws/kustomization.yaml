apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: amacc

resources:
  - ../../base
  - migrator-job.yaml
  - postgres-init-configmap.yaml
  - ingress-alb-split.yaml

patches:
  - path: config-secrets-patch.yaml
  - path: delete-archived-services.yaml
  - path: postgres-fargate-patch.yaml
  - target:
      kind: Ingress
      name: amacc-ingress
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: amacc-ingress
      $patch: delete
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: pgdata
            emptyDir: {}
          - name: postgres-init-scripts
            configMap:
              name: postgres-init-scripts
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: postgres-init-scripts
          mountPath: /docker-entrypoint-initdb.d
  - target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/part-of=amacc"
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "250m"
            memory: "512Mi"
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "250m"
            memory: "512Mi"

