# SECURITY: this file previously contained real, generated-looking secret
# material committed in plaintext (a distinct random Postgres password and
# three distinct random hex tokens for JWT_SECRET/AMACC_JWT_SECRET/
# ADMIN_API_KEY/AMACC_INTERNAL_TOKEN). Repository-closeout policy forbids
# committing secrets or generated credentials, so every value below has been
# replaced with a non-functional placeholder. This overlay is NOT deployable
# as-is — before `kubectl apply`, every CHANGE_ME_* value must be replaced
# via a real secret-management mechanism (AWS Secrets Manager + External
# Secrets Operator, Sealed Secrets, or an untracked local overlay), never by
# editing this file with real values and committing it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: amacc-config
  namespace: amacc
data:
  DATABASE_URL: "postgresql://amacc:CHANGE_ME_RDS_PASSWORD@postgres:5432/amacc"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
  REDIS_URL: "redis://redis:6379"
  NODE_ENV: "production"
  JWT_ISSUER: "amacc"
---
apiVersion: v1
kind: Secret
metadata:
  name: amacc-secrets
  namespace: amacc
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_JWT_SECRET"
  AMACC_JWT_SECRET: "CHANGE_ME_AMACC_JWT_SECRET"
  ADMIN_API_KEY: "CHANGE_ME_ADMIN_API_KEY"
  AMACC_INTERNAL_TOKEN: "CHANGE_ME_AMACC_INTERNAL_TOKEN"
  ANTHROPIC_API_KEY: "sk-ant-placeholder"
  POSTGRES_PASSWORD: "CHANGE_ME_RDS_PASSWORD"
