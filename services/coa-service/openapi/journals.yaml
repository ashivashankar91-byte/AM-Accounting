openapi: 3.1.0
info:
  title: AMACC Journal Lifecycle API (S013)
  version: 1.0.0
  description: >
    Balanced journal posting — the single point of ledger truth (coa-service,
    ADR-JL-001). Posting runs the shared BR013 rule engine and, on a clean pass,
    persists the entry + lines + balance updates + snapshots + outbox + audit in
    one SERIALIZABLE transaction. No AI review gate, no auto-approve.
servers:
  - url: /api/v1/coa
paths:
  /journals:
    post:
      operationId: postJournal
      summary: Post a balanced journal entry (BR013)
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostJournalRequest' }
      responses:
        '201':
          description: Posted (new entry).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostResult' }
        '200':
          description: Idempotent replay — the original entry is returned (BR013-6).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostResult' }
        '400':
          description: Bad request (missing x-tenant-id, malformed body, or missing required field).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Missing the je.post permission (AuthzPort — S207).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: One or more BR013 rules violated — no partial write.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ViolationError' }
  /journals/{number}:
    get:
      operationId: viewJournal
      summary: View a posted journal entry by number (S217)
      description: >
        Read-only render of a posted JE — header, lines, source, poster, timestamps,
        attachments and reversal linkage in both directions (BR217-3). Posted entries
        carry an immutability badge (BR217-2). PII fields are masked at serialization
        for masked roles (S004A) and a masked open emits an audit.viewed event.
        The print view returns the same payload with a print stylesheet.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: number
          in: path
          required: true
          schema: { type: string }
          description: 'Journal number, e.g. GJ-2026-01-000007.'
      responses:
        '200':
          description: The journal view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalView' }
        '403':
          description: Missing the je.view permission (AuthzPort — S207).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No journal with that number — carries a search suggestion (§3).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotFoundWithSuggestion' }
  /journals/{id}:reverse:
    post:
      operationId: reverseJournal
      summary: Reverse a posted journal entry (S218)
      description: >
        Post an equal-and-opposite (mirrored DR<->CR) entry through the single
        posting door into the same or a later OPEN period, linked both ways to the
        original (reversal_of / reversed_by). A reason is mandatory and rendered on
        both documents (BR218-3). An entry is reversible once (BR218-2); a reversal
        is itself reversible (reinstatement, warned). History is never mutated —
        the original is flagged REVERSED. Emits acct.je.posted carrying reversalOf.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: 'Original journal id, addressed as {id}:reverse (colon action).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReverseRequest' }
      responses:
        '201':
          description: Reversal posted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReverseResult' }
        '403':
          description: Missing the je.reverse permission (AuthzPort — S207).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No journal with that id for the tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Already reversed (BR218-2) — carries reversedBy + reversalNumber.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlreadyReversed' }
        '422':
          description: >
            Reason missing (REASON_REQUIRED, BR218-3) or target period not a
            same-or-later OPEN period (CLOSED_TARGET_PERIOD, carries eligiblePeriods[]).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClosedTargetPeriod' }
components:
  parameters:
    TenantHeader:
      name: x-tenant-id
      in: header
      required: true
      schema: { type: string }
  schemas:
    PostJournalRequest:
      type: object
      required: [entityId, date, sourceCode, idempotencyKey, lines]
      properties:
        entityId: { type: string }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', description: 'YYYY-MM-DD; resolved to a period (S208).' }
        sourceCode: { type: string, description: 'Journal source code (S212); must be active and manual-class.' }
        memo: { type: string, maxLength: 500, nullable: true }
        idempotencyKey: { type: string, description: 'Unique per intended posting; a duplicate returns the original (BR013-6).' }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PostLine' }
    PostLine:
      type: object
      required: [accountId, storeId]
      properties:
        accountId: { type: string }
        storeId: { type: string, description: 'Store dimension — required on every line (BR013-5).' }
        deptCode: { type: string, nullable: true, description: 'Required for P&L (REVENUE/EXPENSE) accounts (BR013-5, UQ-16).' }
        controlNumber: { type: string, nullable: true }
        applyNumber: { type: string, nullable: true }
        dr: { oneOf: [{ type: number }, { type: string }], nullable: true, description: 'Debit dollars; exactly one of dr|cr > 0.' }
        cr: { oneOf: [{ type: number }, { type: string }], nullable: true, description: 'Credit dollars; exactly one of dr|cr > 0.' }
        memo: { type: string, maxLength: 500, nullable: true }
    PostResult:
      type: object
      properties:
        id: { type: string }
        journalNumber: { type: string, description: 'Minted from the S213 sequence (BR013-8).' }
        periodCode: { type: string }
        totalDebits: { type: number }
        totalCredits: { type: number }
        status: { type: string, enum: [POSTED] }
        idempotent: { type: boolean }
    ViolationError:
      type: object
      properties:
        error: { type: string, enum: [POSTING_REJECTED] }
        message: { type: string }
        violations:
          type: array
          items:
            type: object
            properties:
              rule: { type: string, description: 'BR013-1 .. BR013-6' }
              lineIndex: { type: integer, nullable: true }
              field: { type: string, nullable: true }
              diagnostic: { type: string }
    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
    JournalLinkRef:
      type: object
      description: A navigable reference to the linked reversal entry (BR217-3).
      properties:
        id: { type: string }
        journalNumber: { type: string }
    AttachmentView:
      type: object
      properties:
        id: { type: string }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
    JournalLineView:
      type: object
      properties:
        lineIndex: { type: integer }
        account: { type: string, description: 'GL account number.' }
        store: { type: string }
        dept: { type: string, nullable: true }
        dr: { type: number }
        cr: { type: number }
        memo: { type: string, nullable: true }
    JournalView:
      type: object
      properties:
        id: { type: string }
        journalNumber: { type: string }
        source: { type: string, description: 'Source code (S212).' }
        periodCode: { type: string }
        entityId: { type: string }
        entryDate: { type: string, description: 'YYYY-MM-DD.' }
        postedBy: { type: string, description: 'Absent when masked for the caller role (BR217-1).' }
        postedAt: { type: string, format: date-time }
        memo: { type: string, nullable: true, description: 'Absent when masked.' }
        status: { type: string, enum: [POSTED, REVERSED] }
        immutable: { type: boolean, description: 'Always true for a persisted JE (BR217-2).' }
        totalDebits: { type: number }
        totalCredits: { type: number }
        lines:
          type: array
          items: { $ref: '#/components/schemas/JournalLineView' }
        reversalOf:
          allOf: [{ $ref: '#/components/schemas/JournalLinkRef' }]
          description: 'Present when this entry reverses another (BR217-3).'
        reversedBy:
          allOf: [{ $ref: '#/components/schemas/JournalLinkRef' }]
          description: 'Present when another entry reversed this one (BR217-3).'
        attachments:
          type: array
          items: { $ref: '#/components/schemas/AttachmentView' }
        maskedFields:
          type: array
          items: { type: string }
          description: 'Present only when one or more fields were masked for the caller.'
    NotFoundWithSuggestion:
      type: object
      properties:
        error: { type: string, enum: [JOURNAL_NOT_FOUND] }
        message: { type: string }
        suggestion:
          type: object
          properties:
            message: { type: string }
            prefix: { type: string, description: 'The source-period prefix used to find siblings.' }
            matches:
              type: array
              items: { type: string }
              description: 'Up to five nearby journal numbers sharing the prefix.'
    ReverseRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500, description: 'Mandatory; rendered on both documents (BR218-3).' }
        targetPeriod: { type: string, nullable: true, description: 'Period code (YYYY-MM); defaults to the original period. Must be same-or-later OPEN.' }
    ReverseResult:
      type: object
      properties:
        reversalId: { type: string }
        reversalNumber: { type: string, description: 'The reversal carries its own sequence number.' }
        reversalPeriod: { type: string }
        originalId: { type: string }
        originalNumber: { type: string }
        reason: { type: string }
        reinstatement: { type: boolean, description: 'True when reversing a reversal (BR218-2, warned).' }
        idempotent: { type: boolean, description: 'True when a duplicate reverse returned the existing reversal.' }
    AlreadyReversed:
      type: object
      properties:
        error: { type: string, enum: [ALREADY_REVERSED] }
        message: { type: string }
        reversedBy: { type: string }
        reversalNumber: { type: string, nullable: true }
    ClosedTargetPeriod:
      type: object
      properties:
        error: { type: string, enum: [CLOSED_TARGET_PERIOD, REASON_REQUIRED] }
        message: { type: string }
        targetPeriod: { type: string }
        eligiblePeriods:
          type: array
          items: { type: string }
          description: 'Same-or-later OPEN period codes the reversal may target.'
